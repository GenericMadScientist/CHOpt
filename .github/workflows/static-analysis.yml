name: Static Analysis

on: push

permissions: {}

jobs:
  clang-tidy:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install libpng
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.*

      - name: Install Boost dependencies
        run: vcpkg install boost-container-hash boost-locale boost-test boost-unordered

      - name: Install clang-tidy 22
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --output /etc/apt/keyrings/llvm-snapshot.gpg.key
          echo "deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg.key] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install clang-tidy-22

      - name: Make build directory
        run: mkdir build

      - name: Generate build files
        working-directory: build
        env:
          CMAKE_TOOLCHAIN_FILE: /usr/local/share/vcpkg/scripts/buildsystems/vcpkg.cmake
          CXX: g++-15
        run: cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPACKAGE_TESTS=ON ..

      - name: Build moc files
        working-directory: build
        run: cmake --build . --target choptgui --verbose

      - name: Run clang tidy
        run: run-clang-tidy-22 -p=build/ -source-filter='^(?!.*(_autogen|extern)).*$' -hide-progress -quiet

  clang-format:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install clang-format 22
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --output /etc/apt/keyrings/llvm-snapshot.gpg.key
          echo "deb [signed-by=/etc/apt/keyrings/llvm-snapshot.gpg.key] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install clang-format-22

      - name: Format
        run: |
          clang-format-22 -i gui/*.hpp gui/*.cpp include/*.hpp src/*.cpp tests/*.cpp tests/*.hpp
          git diff --color --exit-code
